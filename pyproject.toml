[project]
name = "xeryon-control"
readme = "README.md"
version = "0.0.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "canopen~=2.3.0",
    "python-can>=4.5.0",
    "pyserial>=3.5",
    "PySide6-Essentials>=6.9,<7",
]

[dependency-groups]
build = ["pyinstaller==6.21.0"]

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
xeryon_control = ["resources/eds/*", "resources/xeryon-control.ico"]

[tool.setuptools.data-files]
"share/xeryon-control/docs" = ["docs/NOTICE.txt", "docs/reference/xeryon_xla_5_eds_docu.txt"]
